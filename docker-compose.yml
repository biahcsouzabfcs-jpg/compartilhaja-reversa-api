services:
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: oracle-db-compartilhaja
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=compartilhaja_user
      - APP_USER_PASSWORD=oracle
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-compartilhaja
    ports:
      - "8080:8080"
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      - SPRING_DATASOURCE_USERNAME=compartilhaja_user
      - SPRING_DATASOURCE_PASSWORD=oracle
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=oracle.jdbc.OracleDriver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
    networks:
      - app-network

volumes:
  oracle_data:

networks:
  app-network:
    driver: bridge